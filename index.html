<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Shapka</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 20px; }
    textarea { width: 100%; height: 110px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; min-height: 140px; }
    button { padding: 10px 14px; }
    .top { display: flex; gap: 10px; align-items: center; }
    .muted { color: #666; font-size: 13px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="top">
    <button id="run_btn">Run</button>
    <div id="status" class="muted">Ready. Ctrl+Enter to run. | <a href="/wm_view" target="_blank">World Model viewer</a> | <a href="/wm" target="_blank">/wm JSON</a></div>
  </div>

  <div style="margin-top:12px;">
    <textarea id="user_text" placeholder="Type your prompt here..."></textarea>
  </div>

  <div class="row">
    <div>
      <h3>Vanilla LLM (text)</h3>
      <pre id="raw_out"></pre>
    </div>
    <div>
      <h3>LLM + Thinking Cap (text)</h3>
      <pre id="cap_out"></pre>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
